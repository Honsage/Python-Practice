version: '3.3'

volumes:
  static:
  media:
  pg_data:

services:

  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: honsage/kittygram_backend
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/media
    depends_on:
      - db

  frontend:
    image: honsage/kittygram_frontend
    volumes:
      - static:/frontend_static
    depends_on:
      - backend

  gateway:
    image: honsage/kittygram_gateway
    ports:
      - "9000:80"
    volumes:
      - static:/staticfiles
      - media:/media
    depends_on:
      - backend
      - frontend